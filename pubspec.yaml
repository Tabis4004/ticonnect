name: ticonnect
description: Mise en relation entre ouvriers et demandeurs de services.
publish_to: 'none'
# versionName+versionCode. Le versionCode (après le +) doit strictement
# augmenter à chaque AAB déposé sur la Play Console : un numéro déjà utilisé
# est refusé définitivement, même si le dépôt a été supprimé.
version: 2.0.8+11

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  google_mobile_ads: ^7.0.0
  provider: ^6.1.2
  intl: ^0.19.0
  image_picker: ^1.1.0
  url_launcher: ^6.2.6
  cupertino_icons: ^1.0.6
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  # Déjà présent en dépendance transitive (résolu en 10.2.1) ; déclaré ici
  # parce que `devices_service.dart` l'importe directement, et qu'un import
  # non déclaré est une erreur d'analyse.
  package_info_plus: ^10.2.1
  # Notifications push. Exigent android/app/google-services.json, présent
  # depuis le 6 août — sans ce fichier, la compilation Gradle échoue.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
