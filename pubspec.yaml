publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  google_mobile_ads: ^7.0.0
  provider: ^6.1.2
  intl: ^0.19.0
  image_picker: ^1.1.0
  url_launcher: ^6.2.6
  cupertino_icons: ^1.0.6
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
